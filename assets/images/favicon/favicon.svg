<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64"
     viewBox="0 0 64 64">

    <!-- Fond Mirbal -->
    <defs>
        <linearGradient id="mirbalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#4f46e5"/>
        </linearGradient>
    </defs>

    <rect width="64" height="64" rx="14" fill="url(#mirbalGradient)"/>

    <!-- Texte AGDUC -->
    <text x="50%" y="50%"
          text-anchor="middle"
          dominant-baseline="central"
          font-size="22"
          font-family="Montserrat, Arial, Helvetica, sans-serif"
          fill="#ffffff"
          font-weight="700"
          letter-spacing="-1">
        AG
    </text>

    <!-- Sous-marque discrète -->
    <text x="50%" y="75%"
          text-anchor="middle"
          font-size="10"
          font-family="Montserrat, Arial, Helvetica, sans-serif"
          fill="#e0e7ff"
          font-weight="600">
        DUC
    </text>

</svg>
